name: "Workflow CI Plan"
on:
  workflow_call:
    inputs:
      ignored_paths:
        required: true
        type: string
    outputs:
      run_workflow:
        value: ${{ jobs.plan.outputs.run_workflow }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      run_workflow: ${{ steps.plan.outputs.run_workflow }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - id: plan
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        FULL_CI_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        IGNORED_PATHS: ${{ inputs.ignored_paths }}
      run: bash .github/scripts/should-run-workflow.sh
